# ═══ Фрагмент для panel/v5_statusbar.yaml ═══
# Це НЕ окремий пакет: скопіюйте елемент нижче у список widgets: статус-бару
# (контейнера, що лежить у top_layer), на початок списку.
# Вкладки «ГОЛОВНА | WLED» посуньте вправо приблизно на 120 px (збільшіть їхній x).
# Надішліть v5_statusbar.yaml — підлаштую точно.

- label:
    id: bat_label
    align: LEFT_MID          # лівий край статус-бару, по центру висоти
    x: 10
    text: "[.....] --%"
    text_color: ${bat_c_ok}
    # text_font: <id вашого шрифту з теми>
    bg_opa: TRANSP
    clickable: false         # дотики проходять крізь мітку
