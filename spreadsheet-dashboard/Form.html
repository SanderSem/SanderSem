<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{
    --accent:#7c3aed; --accent-2:#6425d6;
    --inc:#10b981; --exp:#3b82f6;
    --ink:#16112b; --ink2:#5b5773; --muted:#8f8ba3;
    --line:#e6e4f0; --bg:#f2f2f9; --surface:#fff; --soft:#f6f6fb;
    --good:#159447; --bad:#dc3d51;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:14px;background:var(--bg);color:var(--ink);
    font-family:Roboto,Arial,sans-serif;font-size:13px}
  h3{margin:0 0 2px;font-size:15px;letter-spacing:-.01em}
  .sub{font-size:11px;color:var(--muted);margin-bottom:14px}
  label{display:block;font-size:11px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
  input,textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);
    background:var(--surface);border:1.5px solid var(--line);border-radius:10px;
    padding:10px 11px;outline:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:44px}
  .seg{display:flex;background:var(--surface);border:1.5px solid var(--line);
    border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:transparent;color:var(--ink2);
    font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:9px;border-radius:8px}
  .seg button.on[data-t="Дохід"]{background:var(--inc);color:#fff}
  .seg button.on[data-t="Витрата"]{background:var(--exp);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .tile{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;
    padding:10px 6px;cursor:pointer;text-align:center;font-size:12px;font-weight:700;
    color:var(--ink2);position:relative}
  .tile .em{display:block;font-size:20px;margin-bottom:4px}
  .tile.on{border-color:var(--accent);background:#f1eafd;color:var(--ink)}
  .tile.on::after{content:"✓";position:absolute;top:5px;right:7px;width:16px;height:16px;
    border-radius:50%;background:var(--accent);color:#fff;font-size:10px;line-height:16px}
  .btn{width:100%;border:0;margin-top:16px;padding:13px;border-radius:12px;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
    font:inherit;font-size:14px;font-weight:700}
  .btn:disabled{opacity:.6;cursor:wait}
  #msg{margin-top:10px;font-size:12px;font-weight:700;text-align:center;min-height:16px}
  #msg.ok{color:var(--good)} #msg.err{color:var(--bad)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
</style>
</head>
<body>
  <h3>Нова операція</h3>
  <div class="sub">запис одразу потрапляє в «Журнал», дашборд оновиться сам</div>

  <label>Тип операції</label>
  <div class="seg" id="seg">
    <button type="button" data-t="Дохід">↗ Дохід</button>
    <button type="button" data-t="Витрата" class="on">↘ Витрата</button>
  </div>

  <div class="row2">
    <div><label>Дата</label><input type="date" id="date"></div>
    <div><label>Сума, ₴</label><input type="number" id="sum" min="0" step="1" placeholder="0"></div>
  </div>

  <label>Категорія</label>
  <div class="grid" id="grid"></div>

  <label>Примітка</label>
  <textarea id="note" placeholder="необов'язково — напр. Тканина, ЗП Ігор"></textarea>

  <button class="btn" id="add">✓ Додати операцію</button>
  <div id="msg"></div>

<script>
  var CATS = {
    'Витрата': [['Матеріали','🧵'],['Зарплата','👥'],['Реклама','📣'],['Операційні','⚙️'],['Інше','📦']],
    'Дохід':   [['Instagram','📸'],['Оптом','🚚'],['Термінове','⚡'],['Корпоративне','💼'],['Інше','💰']]
  };
  var type = 'Витрата', cat = CATS[type][0][0];

  document.getElementById('date').value = new Date().toISOString().slice(0,10);

  function renderGrid(){
    var g = document.getElementById('grid');
    g.innerHTML = CATS[type].map(function(c){
      return '<div class="tile'+(c[0]===cat?' on':'')+'" data-c="'+c[0]+'">'+
        '<span class="em">'+c[1]+'</span>'+c[0]+'</div>';
    }).join('');
  }
  renderGrid();

  document.getElementById('seg').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    type = b.getAttribute('data-t'); cat = CATS[type][0][0];
    var bs = document.querySelectorAll('#seg button');
    for (var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i]===b);
    renderGrid();
  });
  document.getElementById('grid').addEventListener('click', function(e){
    var t = e.target.closest('.tile'); if(!t) return;
    cat = t.getAttribute('data-c'); renderGrid();
  });

  document.getElementById('add').addEventListener('click', function(){
    var btn = this, msg = document.getElementById('msg');
    var sum = +document.getElementById('sum').value,
        date = document.getElementById('date').value;
    if (!date || !sum || sum <= 0){ msg.className='err'; msg.textContent='Вкажіть дату і суму більше 0'; return; }
    btn.disabled = true; msg.className=''; msg.textContent='Зберігаю…';
    google.script.run
      .withSuccessHandler(function(r){
        btn.disabled = false; msg.className='ok'; msg.textContent=(type==='Дохід'?'✓ Дохід':'✓ Витрату')+' додано';
        document.getElementById('sum').value=''; document.getElementById('note').value='';
        setTimeout(function(){ msg.textContent=''; }, 2500);
      })
      .withFailureHandler(function(e){
        btn.disabled = false; msg.className='err'; msg.textContent = e && e.message ? e.message : 'Помилка збереження';
      })
      .addTx({type:type, date:date, sum:sum, cat:cat, note:document.getElementById('note').value});
  });
</script>
</body>
</html>
