-- Права колонка: CPU, GPU, RAM, погода, живлення
conky.config = {
  background = true,
  update_interval = 2,
  double_buffer = true,
  text_buffer_size = 8192,

  own_window = true,
  own_window_type = 'desktop',
  own_window_class = 'ConkyDeskRight',
  own_window_transparent = false,
  own_window_argb_visual = true,
  own_window_argb_value = 0,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

  alignment = 'top_right',
  gap_x = 70,
  gap_y = 60,
  minimum_width = 290, maximum_width = 290,
  minimum_height = 820,
  border_inner_margin = 0, border_outer_margin = 0, border_width = 0,
  -- xinerama_head = 0,

  draw_shades = false, draw_outline = false, draw_borders = false, draw_graph_borders = false,
  use_xft = true,
  font = 'Ubuntu:size=9',
  override_utf8_locale = true,
  short_units = true,
  pad_percents = 0,
  cpu_avg_samples = 2,
  no_buffers = true,
  imlib_cache_size = 0,

  default_color = '#c9d3e6',
  color0 = '#8793b0',
  color1 = '#e3e9f7',
  color2 = '#6e9cf5',
  color3 = '#5fd3a0',
  color4 = '#f2b25c',
  color5 = '#f26d6d',

  template0 = [[${execpi \1 ~/.config/conky-desk/scripts/widgets.py \2}]],
  template1 = [[${execi \1 ~/.config/conky-desk/scripts/widgets.py \2 \3}]],
}

conky.text = [[
${color0}${font Ubuntu:size=7}ПРОЦЕСОР${font}${alignr}${color2}${font Ubuntu Light:size=17}${cpu cpu0}%${font}
${voffset -8}${color}${template1 5 cpu_temp}  ${freq_g} GHz
${cpugraph cpu0 20,290 6e9cf5 6e9cf5}
${voffset 9}${color0}${font Ubuntu:size=7}ВІДЕОКАРТА${font}${alignr}${color3}${font Ubuntu Light:size=17}${template1 2 gpu util}%${font}
${voffset -8}${color}${template1 2 gpu temp}  ${template1 2 gpu clock}
${execgraph "~/.config/conky-desk/scripts/widgets.py gpu util" 20,290 5fd3a0 5fd3a0 100}
${voffset 9}${color0}${font Ubuntu:size=7}ПАМ’ЯТЬ${font}${alignr}${color4}${font Ubuntu Light:size=17}${memperc}%${font}
${voffset -8}${color}${mem} / ${memmax}
${color4}${membar 2,290}
${template0 600 weather}
${template0 3 power}
]]
