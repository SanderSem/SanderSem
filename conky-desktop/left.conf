-- Ліва колонка: система, диск, резервна копія, календар, мережа, оновлення, пам'ять
conky.config = {
  background = true,
  update_interval = 2,
  double_buffer = true,
  text_buffer_size = 8192,

  -- вікно: прозоре, під усіма вікнами, не в панелі завдань
  own_window = true,
  own_window_type = 'desktop',
  own_window_class = 'ConkyDeskLeft',
  own_window_transparent = false,
  own_window_argb_visual = true,
  own_window_argb_value = 0,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

  -- позиція (для HiDPI збільште gap_x/gap_y та розміри шрифтів)
  alignment = 'top_left',
  gap_x = 70,
  gap_y = 60,
  minimum_width = 290, maximum_width = 290,
  minimum_height = 820,   -- фіксована висота, щоб блоки зі скриптів не обрізались
  border_inner_margin = 0, border_outer_margin = 0, border_width = 0,
  -- xinerama_head = 0,   -- розкоментуйте, щоб закріпити на конкретному моніторі

  draw_shades = false, draw_outline = false, draw_borders = false, draw_graph_borders = false,
  use_xft = true,
  font = 'Ubuntu:size=9',
  override_utf8_locale = true,
  short_units = true,
  pad_percents = 0,
  cpu_avg_samples = 2,
  net_avg_samples = 2,
  no_buffers = true,
  imlib_cache_size = 0,

  default_color = '#c9d3e6',
  color0 = '#8793b0',   -- приглушений (підписи)
  color1 = '#e3e9f7',   -- яскравий текст
  color2 = '#6e9cf5',   -- синій
  color3 = '#5fd3a0',   -- зелений
  color4 = '#f2b25c',   -- помаранчевий
  color5 = '#f26d6d',   -- червоний

  -- ${template0 <інтервал> <команда>}  : блок розмітки зі скрипта
  template0 = [[${execpi \1 ~/.config/conky-desk/scripts/widgets.py \2}]],
  -- ${template1 <інтервал> <команда> [аргумент]} : просте значення
  template1 = [[${execi \1 ~/.config/conky-desk/scripts/widgets.py \2 \3}]],
}

conky.text = [[
${font Ubuntu Light:size=26}${color1}Linux${font}
${voffset 5}${color0}${template0 3600 os}
${voffset 8}${color0}Ядро${alignr}${color}${kernel}
${color0}Архітектура${alignr}${color}${machine}
${color0}Час роботи${alignr}${color}${uptime}
${color0}VPN${alignr}${template0 10 vpn}
${voffset 9}${color0}${font Ubuntu:size=7}ДИСК${font}${alignr}${color4}${font Ubuntu Light:size=17}${fs_used_perc /}%${font}
${voffset -8}${color}вільно ${fs_free /} з ${fs_size /}
${color4}${fs_bar 2,290 /}
${template0 600 backup}
${template0 600 calendar}
${voffset 9}${color0}${font Ubuntu:size=7}ЗАВАНТАЖЕННЯ${font}${alignr}${color2}${font Ubuntu Light:size=17}${downspeed ${gw_iface}}${font}
${voffset -4}${downspeedgraph ${gw_iface} 20,290 6e9cf5 6e9cf5}
${voffset 6}${color0}${font Ubuntu:size=7}ВІДПРАВЛЕННЯ${font}${alignr}${color3}${font Ubuntu Light:size=17}${upspeed ${gw_iface}}${font}
${voffset -4}${upspeedgraph ${gw_iface} 20,290 5fd3a0 5fd3a0}
${voffset 9}${color0}${font Ubuntu:size=7}ОНОВЛЕННЯ${font}${alignr}${template0 1800 updates}
${voffset -8}${color}доступно для встановлення
${voffset 9}${color0}${font Ubuntu:size=7}НАЙБІЛЬШЕ ПАМ’ЯТІ${font}
${color}${top_mem name 1}${alignr}${color2}${top_mem mem_res 1}
${color}${top_mem name 2}${alignr}${color2}${top_mem mem_res 2}
${color}${top_mem name 3}${alignr}${color2}${top_mem mem_res 3}
]]
