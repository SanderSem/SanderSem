-- Центр: великий годинник і дата
conky.config = {
  background = true,
  update_interval = 2,
  double_buffer = true,
  text_buffer_size = 2048,

  own_window = true,
  own_window_type = 'desktop',
  own_window_class = 'ConkyDeskClock',
  own_window_transparent = false,
  own_window_argb_visual = true,
  own_window_argb_value = 0,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

  alignment = 'top_middle',
  gap_x = 0,
  gap_y = 130,
  minimum_width = 640, maximum_width = 640,
  minimum_height = 240,
  border_inner_margin = 0, border_outer_margin = 0, border_width = 0,
  -- xinerama_head = 0,

  draw_shades = false, draw_outline = false, draw_borders = false, draw_graph_borders = false,
  use_xft = true,
  font = 'Ubuntu:size=9',
  override_utf8_locale = true,
  no_buffers = true,
  imlib_cache_size = 0,

  default_color = '#c9d3e6',
  template0 = [[${execpi \1 ~/.config/conky-desk/scripts/widgets.py \2}]],
}

conky.text = [[
${alignc}${font Ubuntu Light:size=72}${color #eef2fc}${time %H:%M}${font}
${voffset 6}${alignc}${font Ubuntu:size=13}${template0 30 date}${font}
]]
